<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:;" />
    <title>Kairos — AI Teacher Copilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Set the theme before first paint to avoid a flash of the wrong theme. */
      (function () {
        try {
          var t = localStorage.getItem('kairos-theme')
          if (!t) {
            var ui = localStorage.getItem('kairos-ui')
            if (ui) { try { t = (JSON.parse(ui).state || {}).theme } catch (e) {} }
          }
          if (!t) {
            if (window.matchMedia && matchMedia('(prefers-contrast: more)').matches) t = 'high-contrast'
            else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark'
            else t = 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
